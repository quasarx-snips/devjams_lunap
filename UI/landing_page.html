<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunaP - DevJams '26 | Team KompilerZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #05050a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* Background ambient glow */
        body::before {
            content: '';
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 400px;
            background: radial-gradient(circle, rgba(120, 50, 255, 0.16) 0%, rgba(5, 5, 10, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Top Navigation Bar */
        header {
            width: 100%;
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .gdg-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
        }

        .gdg-logo svg {
            width: 32px;
            height: 32px;
        }

        .gdg-text {
            display: flex;
            flex-direction: column;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.2;
        }

        .gdg-sub {
            font-size: 10px;
            color: #a0a0a0;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .menu-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }

        /* Cartoon Cat Menu Icon matching theme */
        .menu-cat {
            width: 38px;
            height: 38px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2300ffcc"><path d="M5 3L8.5 7H15.5L19 3L21 6V11C21 16.5 17 21 12 21C7 21 3 16.5 3 11V6L5 3M8 10C7.45 10 7 10.45 7 11C7 11.55 7.45 12 8 12C8.55 12 9 11.55 9 11C9 10.45 8.55 10 8 10M16 10C15.45 10 15 10.45 15 11C15 11.55 15.45 12 16 12C16.55 12 17 11.55 17 11C17 10.45 16.55 10 16 10M12 14C10.5 14 9.5 14.8 9 15.5C9 16.2 9.8 17 10.5 17C11.1 17 11.5 16.5 12 16.5C12.5 16.5 12.9 17 13.5 17C14.2 17 15 16.2 15 15.5C14.5 14.8 13.5 14 12 14Z"/></svg>') no-repeat center;
            filter: drop-shadow(0 0 10px rgba(0,255,204,0.7));
            transition: transform 0.3s ease;
        }

        .menu-container:hover .menu-cat {
            transform: scale(1.1) rotate(6deg);
        }

        /* Main Content */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            max-width: 1350px;
            padding: 0 24px;
            z-index: 10;
            text-align: center;
            gap: 16px;
            margin-top: -20px;
        }

        /* LunaP Heading with Maximum Scale & Tight Spacing */
        .lunap-title {
            font-size: clamp(7.5rem, 20vw, 20rem);
            font-weight: 900;
            letter-spacing: -8px;
            line-height: 0.78;
            display: flex;
            justify-content: center;
            user-select: none;
            position: relative;
            margin-bottom: -25px;
            z-index: 4;
        }

        .char {
            display: inline-block;
            color: #ffffff;
            -webkit-text-stroke: 1.5px #000000;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.9);
            margin-right: -0.06em;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: default;
        }

        .char:hover {
            transform: translateY(-20px) scale(1.25) rotate(4deg);
            z-index: 5;
        }

        /* Icons Row positioned right under/overlapping text */
        .icons-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(16px, 3vw, 36px);
            flex-wrap: wrap;
            z-index: 6;
            margin-top: -10px;
        }

        .space-icon {
            width: clamp(75px, 10vw, 115px);
            height: clamp(75px, 10vw, 115px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
            cursor: pointer;
            filter: drop-shadow(0 10px 20px rgba(110, 40, 255, 0.35));
        }

        .space-icon:hover {
            transform: translateY(-14px) scale(1.18);
            filter: drop-shadow(0 15px 30px rgba(168, 85, 247, 0.75));
        }

        @keyframes jumpBounce1 {
            0%, 100% { transform: translateY(0) scale(1.08); }
            50% { transform: translateY(-22px) scale(1.15) rotate(-3deg); }
        }
        @keyframes jumpBounce2 {
            0%, 100% { transform: translateY(0) scale(1.08); }
            50% { transform: translateY(-18px) scale(1.14) rotate(4deg); }
        }
        @keyframes jumpBounce3 {
            0%, 100% { transform: translateY(0) scale(1.08); }
            50% { transform: translateY(-25px) scale(1.18) rotate(-5deg); }
        }
        @keyframes jumpBounce4 {
            0%, 100% { transform: translateY(0) scale(1.08); }
            50% { transform: translateY(-20px) scale(1.16) rotate(3deg); }
        }

        .space-icon.jumping:nth-child(1) { animation: jumpBounce1 0.42s ease-in-out infinite; }
        .space-icon.jumping:nth-child(2) { animation: jumpBounce2 0.48s ease-in-out infinite; }
        .space-icon.jumping:nth-child(3) { animation: jumpBounce3 0.39s ease-in-out infinite; }
        .space-icon.jumping:nth-child(4) { animation: jumpBounce4 0.45s ease-in-out infinite; }

        /* LunaP Heading with Larger Scale & Tight Spacing */
        .lunap-title {
            font-size: clamp(6rem, 16vw, 16rem);
            font-weight: 900;
            letter-spacing: -6px;
            line-height: 0.82;
            display: flex;
            justify-content: center;
            user-select: none;
            position: relative;
            margin-bottom: -15px;
        }

        .char {
            display: inline-block;
            color: #ffffff;
            -webkit-text-stroke: 1.5px #000000;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.9);
            margin-right: -0.06em;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.2s ease, text-shadow 0.2s ease;
            cursor: default;
        }

        .char:hover {
            transform: translateY(-24px) scale(1.3) rotate(5deg);
            color: #ffffff;
            text-shadow: 5px 10px 0px rgba(0,0,0,0.9);
            z-index: 5;
        }

        /* Subtitle */
        .subtitle {
            font-size: clamp(1.1rem, 2.2vw, 1.5rem);
            font-weight: 600;
            color: #cbd5e1;
            letter-spacing: -0.3px;
            max-width: 750px;
            margin-top: 10px;
        }

        /* Proceed Further Button */
        .btn-proceed {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            color: #05050a;
            padding: 16px 36px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
            border: none;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-proceed:hover {
            transform: scale(1.08) translateY(-3px);
            background: #f1f5f9;
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.5);
        }

        .btn-proceed svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .btn-proceed:hover svg {
            transform: translateX(6px);
        }

        /* Toast notification */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(168, 85, 247, 0.95);
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            pointer-events: none;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Laser Beam Overlay */
        #laser-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>

    <canvas id="laser-canvas"></canvas>

    <div id="toast">Initializing Autonomous Orbital Systems...</div>

    <!-- Header -->
    <header>
        <a href="#" class="gdg-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 8L3 12L7 16" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17 8L21 12L17 16" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 6L10 18" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <div class="gdg-text">

        </a>
        <div class="menu-container">
            <span>Menu</span>
            <div class="menu-cat"></div>

    </header>

    <main class="main-container">
        
        <!-- LunaP Heading First (Matching Reference Portal Layout) -->
        <h1 class="lunap-title" id="lunap-heading">
            <span class="char">L</span><span class="char">u</span><span class="char">n</span><span class="char">a</span><span class="char">P</span>
        </h1>

        <!-- 4 Reference Icons overlapping/tucked right under the massive title -->
        <div class="icons-row">
            <!-- 1. Satellite Icon (Refined Professional Vector) -->
            <svg class="space-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="edgyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">

                <!-- Left Solar Panel Wing -->

                    <line x1="71" y1="38" x2="71" y2="62" stroke="#3b82f6" stroke-width="1.5"/>
                    <line x1="78" y1="38" x2="78" y2="62" stroke="#3b82f6" stroke-width="1.5"/>
                    <line x1="85" y1="38" x2="85" y2="62" stroke="#3b82f6" stroke-width="1.5"/>
                    <line x1="64" y1="50" x2="92" y2="50" stroke="#3b82f6" stroke-width="1.5"/>
                </g>

                <rect x="42" y="38" width="16" height="12" rx="2" fill="#05050a" stroke="#3b82f6" stroke-width="1.5"/>
                <circle cx="50" cy="58" r="4" fill="#00ffcc"/>
                <!-- Communication Dish on Top -->
                <path d="M42 22C42 17 58 17 58 22" stroke="#a855f7" stroke-width="2" fill="url(#edgyGrad1)" />
                <line x1="50" y1="22" x2="50" y2="32" stroke="#a855f7" stroke-width="2.5"/>
                <circle cx="50" cy="20" r="2" fill="#ff2a6d"/>
                <!-- Antennae / Thrusters -->
                <path d="M40 68L34 80M60 68L66 80" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
                <path d="M47 68V76M53 68V76" stroke="#ff2a6d" stroke-width="2" stroke-linecap="round"/>
            </svg>

            <!-- 2. Moon Icon -->
            <svg class="space-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="edgyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#05050a" />
                        <stop offset="35%" stop-color="#312e81" />
                        <stop offset="70%" stop-color="#8b5cf6" />
                        <stop offset="100%" stop-color="#ec4899" />
                    </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="42" fill="url(#edgyGrad2)" stroke="#a855f7" stroke-width="3"/>
                <circle cx="38" cy="45" r="9" fill="#05050a" stroke="#7c3aed" stroke-width="2"/>
                <circle cx="68" cy="62" r="8" fill="#05050a" stroke="#7c3aed" stroke-width="2"/>
                <circle cx="60" cy="32" r="5" fill="#05050a" stroke="#7c3aed" stroke-width="1.5"/>
                <circle cx="48" cy="68" r="4" fill="#05050a" stroke="#7c3aed" stroke-width="1.5"/>
                <circle cx="28" cy="58" r="3.5" fill="#05050a" stroke="#7c3aed" stroke-width="1.5"/>
                <path d="M22 36C26 32 30 32 32 32" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
                <path d="M72 45L80 42M74 52L82 49" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>

            <!-- 3. Lander Icon -->
            <svg class="space-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="edgyGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#05050a" />
                        <stop offset="30%" stop-color="#1e1b4b" />
                        <stop offset="65%" stop-color="#6d28d9" />
                        <stop offset="100%" stop-color="#3b82f6" />
                    </linearGradient>
                </defs>
                <line x1="50" y1="8" x2="50" y2="16" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M38 28C38 18 62 18 62 28V34H38V28Z" fill="url(#edgyGrad3)" stroke="#a855f7" stroke-width="2.5"/>
                <circle cx="50" cy="26" r="8" fill="#05050a" stroke="#3b82f6" stroke-width="2"/>
                <path d="M46 26C46 24 48 22 50 22V30C48 30 46 28 46 26Z" fill="#ff2a6d"/>
                <rect x="30" y="34" width="40" height="22" rx="4" fill="url(#edgyGrad3)" stroke="#a855f7" stroke-width="2.5"/>
                <path d="M30 56H70L62 74H38L30 56Z" fill="url(#edgyGrad3)" stroke="#a855f7" stroke-width="2.5"/>
                <circle cx="50" cy="65" r="4" fill="#05050a" stroke="#3b82f6" stroke-width="2"/>
                <path d="M34 74L16 90M66 74L84 90M50 74V90" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
                <rect x="12" y="88" width="10" height="4" rx="1" fill="#3b82f6"/>
                <rect x="78" y="88" width="10" height="4" rx="1" fill="#3b82f6"/>
                <rect x="44" y="88" width="12" height="4" rx="1" fill="#3b82f6"/>
            </svg>

            <!-- 4. Rover Icon with Optimized Right Arm & Mouse-Tracking Laser Eyes -->
            <svg class="space-icon" id="lander-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="edgyGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#05050a" />
                        <stop offset="35%" stop-color="#3b0764" />

                <path d="M68 40V24H84V30" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

                <circle id="left-pupil" cx="42" cy="26" r="5" fill="#ff2a6d" />
                <circle id="right-pupil" cx="58" cy="26" r="5" fill="#ff2a6d" />

        <!-- Subtitle -->
        <p class="subtitle">Autonomous Hazard-aware lunar surface navigator and analyzer</p>

        <!-- Proceed Further Button -->
        <button class="btn-proceed" id="proceed-btn" onclick="triggerToast()">
            Proceed further
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 12H19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

            </svg>

    </main>

    <script>
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            updateRoverEyes();
        });

        const landerSvg = document.getElementById('lander-svg');
        const leftPupil = document.getElementById('left-pupil');
        const rightPupil = document.getElementById('right-pupil');
        const canvas = document.getElementById('laser-canvas');
        const ctx = canvas.getContext('2d');
        const proceedBtn = document.getElementById('proceed-btn');
        const spaceIcons = document.querySelectorAll('.space-icon');

        // Hover effect on proceed button: Make the 4 space icons jump randomly
        proceedBtn.addEventListener('mouseenter', () => {
            spaceIcons.forEach(icon => icon.classList.add('jumping'));
        });
        proceedBtn.addEventListener('mouseleave', () => {
            spaceIcons.forEach(icon => icon.classList.remove('jumping'));
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function updateRoverEyes() {
            const rect = landerSvg.getBoundingClientRect();
            if (rect.width === 0) return;
            const scaleX = rect.width / 100;
            const scaleY = rect.height / 100;

            const leftEyeBaseX = rect.left + 42 * scaleX;
            const leftEyeBaseY = rect.top + 26 * scaleY;
            const rightEyeBaseX = rect.left + 58 * scaleX;
            const rightEyeBaseY = rect.top + 26 * scaleY;

            const angleLeft = Math.atan2(mouseY - leftEyeBaseY, mouseX - leftEyeBaseX);
            const angleRight = Math.atan2(mouseY - rightEyeBaseY, mouseX - rightEyeBaseX);

            const maxDist = 3.5;
            leftPupil.setAttribute('cx', 42 + Math.cos(angleLeft) * maxDist);
            leftPupil.setAttribute('cy', 26 + Math.sin(angleLeft) * maxDist);
            rightPupil.setAttribute('cx', 58 + Math.cos(angleRight) * maxDist);
            rightPupil.setAttribute('cy', 26 + Math.sin(angleRight) * maxDist);
        }

        // Render Loop for High-Speed Laser Beams (Red when away, Green when near button)
        let laserPulse = 0;
        function renderLasers() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const rect = landerSvg.getBoundingClientRect();
            if (rect.width > 0) {
                const scaleX = rect.width / 100;
                const scaleY = rect.height / 100;

                const leftEyeX = rect.left + 42 * scaleX;
                const leftEyeY = rect.top + 26 * scaleY;
                const rightEyeX = rect.left + 58 * scaleX;
                const rightEyeY = rect.top + 26 * scaleY;

                // Check distance to "Proceed further" button
                const btnRect = proceedBtn.getBoundingClientRect();
                const btnCenterX = btnRect.left + btnRect.width / 2;
                const btnCenterY = btnRect.top + btnRect.height / 2;
                const distToBtn = Math.hypot(mouseX - btnCenterX, mouseY - btnCenterY);

                const isNearButton = distToBtn < 150 || (mouseX >= btnRect.left - 50 && mouseX <= btnRect.right + 50 && mouseY >= btnRect.top - 50 && mouseY <= btnRect.bottom + 50);
                
                const laserColor = isNearButton ? '#00ffcc' : '#ff2a6d';

                laserPulse += 0.3;
                const alpha = 0.85 + Math.sin(laserPulse) * 0.15;

                // Left Eye Laser Beam
                ctx.beginPath();
                ctx.moveTo(leftEyeX, leftEyeY);
                ctx.lineTo(mouseX, mouseY);
                ctx.strokeStyle = isNearButton ? `rgba(0, 255, 204, ${alpha})` : `rgba(255, 42, 109, ${alpha})`;
                ctx.lineWidth = 2.5;
                ctx.shadowColor = laserColor;
                ctx.shadowBlur = 18;
                ctx.stroke();

                // Right Eye Laser Beam
                ctx.beginPath();
                ctx.moveTo(rightEyeX, rightEyeY);
                ctx.lineTo(mouseX, mouseY);
                ctx.strokeStyle = isNearButton ? `rgba(0, 255, 204, ${alpha})` : `rgba(255, 42, 109, ${alpha})`;
                ctx.lineWidth = 2.5;
                ctx.shadowColor = laserColor;
                ctx.shadowBlur = 18;
                ctx.stroke();

                // Target Lock Glow at Mouse
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, isNearButton ? 8 : 6, 0, Math.PI * 2);
                ctx.fillStyle = isNearButton ? 'rgba(0, 255, 204, 0.9)' : 'rgba(255, 42, 109, 0.9)';
                ctx.fill();
            }

            requestAnimationFrame(renderLasers);
        }

        requestAnimationFrame(renderLasers);

        function triggerToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('string') || toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
