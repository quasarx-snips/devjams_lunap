<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunaP - DevJams '26 | Team KompilerZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
        :root{--bg:#05050a;--accent:#a855f7;--neon:#00ffcc;--highlight:#ff2a6d;--muted:#a0a0a0}
        html,body{height:100%;background:var(--bg);color:#fff}
        body{overflow:hidden;display:flex;flex-direction:column;align-items:center}

        header{width:100%;padding:16px 36px;display:flex;justify-content:space-between;align-items:center;z-index:20}
        .gdg-logo{display:flex;align-items:center;gap:10px;color:#fff}
        .gdg-text{display:flex;flex-direction:column;font-weight:700}
        .gdg-sub{font-size:11px;color:var(--muted);font-weight:600}

        .main-container{position:relative;width:100%;flex:1;display:flex;align-items:center;justify-content:center}

        /* Icons & hero */
        .hero-wrapper{position:relative;z-index:18;display:flex;flex-direction:column;align-items:center;gap:8px}
        .lunap-title{font-size:clamp(4rem,12vw,10rem);font-weight:900;letter-spacing:-0.06em;user-select:none;z-index:22}
        .icons-row{display:flex;align-items:end;justify-content:center;gap:22px;margin-top:22px;transition:transform 0.9s cubic-bezier(.2,.9,.2,1),opacity .6s}
        .space-icon{width:clamp(80px,14vw,160px);height:auto;transition:transform .6s ease,opacity .6s ease}

        /* launch icons animation: when .launched applied icons fly outward */
        .icons-row.launched .space-icon{transform:translateY(-180vh) scale(.6);opacity:0}

        /* bottom moon (initial) */
        .moon-layer{position:fixed;left:50%;bottom:-15vh;transform:translateX(-50%) translateY(0) scale(.6);width:420px;height:220px;z-index:10;pointer-events:none;transition:transform 1.1s cubic-bezier(.2,.9,.2,1),bottom 1s ease}
        .moon-curve{width:100%;height:100%}

        /* central moon (revealed) */
        .central-moon-wrap{position:fixed;left:50%;top:60%;transform:translate(-50%,0) scale(0.6);width:360px;height:360px;border-radius:50%;overflow:hidden;z-index:30;opacity:0;transition:transform 1s cubic-bezier(.2,.9,.2,1),opacity 0.8s ease,top 1s cubic-bezier(.2,.9,.2,1)}
        .central-moon-wrap.revealed{top:50%;transform:translate(-50%,-50%) scale(1);opacity:1}
        .central-moon{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 30%, #f8fafc 0%, #e6e8ff 20%, #d6d3f9 45%, #bdb8f6 70%, #a78bfa 100%);box-shadow:inset -12px -8px 40px rgba(0,0,0,.5);position:relative;display:flex;align-items:center;justify-content:center}

        .moon-upload-area{position:absolute;inset:20%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
        .upload-btn{background:#fff;color:var(--bg);padding:10px 16px;border-radius:999px;border:none;font-weight:700;cursor:pointer}
        .process-btn{background:var(--neon);color:#05050a;padding:8px 14px;border-radius:999px;border:none;font-weight:800;cursor:pointer}
        .upload-input{display:none}
        .preview-img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(168,85,247,0.15)}

        /* satellite & earth top-right */
        .earth-top{position:fixed;right:6%;top:6%;width:60px;height:60px;z-index:40;display:flex;align-items:center;justify-content:center}
        .earth-dot-small{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #9ef6d4 0%, #22d0ff 55%, #0b61ff 100%);box-shadow:0 6px 18px rgba(11,97,255,0.25)}
        .satellite-top{position:absolute;right:calc(6% - 40px);top:calc(6% + 10px);width:40px;height:40px;z-index:41;transform-origin:center;}
        .sat-orbit{animation:spin 4.5s linear infinite}
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

        /* path visual (hidden by default) */
        svg.full-path{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:35}
        .invisible{opacity:0}

        /* scanning beam */
        .scan-overlay{position:absolute;inset:0;pointer-events:none}
        .scan-beam{position:absolute;left:-60%;top:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,255,204,0.55),transparent);transform:skewX(-12deg);opacity:0}

        /* helper */
        .hide{display:none}

        @media (max-width:780px){.central-moon-wrap{width:280px;height:280px}.moon-layer{width:320px;height:160px}}
    </style>
</head>
<body>

    <header>
        <a href="#" class="gdg-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="36" height="36">
                <path d="M7 8L3 12L7 16" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17 8L21 12L17 16" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 6L10 18" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <div class="gdg-text">Team KompilerZ <span class="gdg-sub">DevJams'26 • LunaP</span></div>
        </a>
        <div class="menu-container">Menu <div class="menu-cat"></div></div>
    </header>

    <main class="main-container">
        <div class="hero-wrapper">
            <h1 class="lunap-title">LunaP</h1>
            <div class="icons-row" id="iconsRow">
                <svg class="space-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"> <rect x="4" y="38" width="30" height="24" rx="6" fill="#7c3aed" /> </svg>
                <svg class="space-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"> <circle cx="50" cy="50" r="44" fill="#8b5cf6" /> </svg>
                <svg class="space-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" id="lander-small"> <rect x="24" y="16" width="52" height="24" rx="12" fill="#7e22ce"/> </svg>
            </div>
            <button class="btn-proceed upload-btn" id="proceedBtn">Proceed further</button>
        </div>
    </main>

    <!-- bottom moon curve (initial) -->
    <div class="moon-layer" id="moonCurve">
        <svg class="moon-curve" viewBox="0 0 1600 400" preserveAspectRatio="none"><path d="M0,220 C200,180 400,140 600,150 C800,160 1000,200 1200,190 C1400,180 1600,160 1600,160 L1600,400 L0,400 Z" fill="#0a0713"/></svg>
    </div>

    <!-- central moon that appears after proceed -->
    <div class="central-moon-wrap" id="centralMoon">
        <div class="central-moon">
            <div class="moon-upload-area" id="moonUploadArea">
                <input type="file" id="moonFile" class="upload-input" accept="image/*">
                <button class="upload-btn" id="moonChoose">Choose Image</button>
                <button class="process-btn hide" id="moonProcess">Process Image</button>
                <div class="scan-overlay" id="moonScan"><div class="scan-beam" id="moonScanBeam"></div></div>
            </div>
        </div>
    </div>

    <!-- earth top-right & satellite orbiting -->
    <div class="earth-top">
        <svg width="60" height="60" viewBox="0 0 64 64"><defs><radialGradient id="eg2" cx="20%" cy="25%"><stop offset="0%" stop-color="#bff3db"/><stop offset="60%" stop-color="#1ecbff"/><stop offset="100%" stop-color="#0b61ff"/></radialGradient></defs><circle cx="32" cy="32" r="28" fill="url(#eg2)" stroke="#06345a" stroke-width="2"/></svg>
        <div class="earth-dot-small" id="earthTopDot" style="position:absolute;right:6px;top:6px"></div>
        <div class="satellite-top sat-orbit" id="topSatellite">
            <svg viewBox="0 0 64 64" width="40" height="40" xmlns="http://www.w3.org/2000/svg">
              <rect x="6" y="18" width="52" height="28" rx="4" fill="#0b0b10" stroke="#7c3aed" stroke-width="2"/>
              <circle cx="32" cy="32" r="4" fill="#00ffcc" />
            </svg>
        </div>
    </div>

    <!-- SVG path for satellite flight (invisible but used for getPointAtLength) -->
    <svg class="full-path invisible" id="flightPathSVG" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <!-- path from top-right (earth) to moon center, a smooth elliptical style path -->
        <path id="flightPath" d="M1700,120 C1450,260 1200,400 980,560" stroke="rgba(255,255,255,0.08)" fill="none" stroke-width="2"/>
    </svg>

    <script>
        // Elements
        const proceedBtn = document.getElementById('proceedBtn');
        const iconsRow = document.getElementById('iconsRow');
        const moonCurve = document.getElementById('moonCurve');
        const centralMoon = document.getElementById('centralMoon');
        const moonChoose = document.getElementById('moonChoose');
        const moonFile = document.getElementById('moonFile');
        const moonProcess = document.getElementById('moonProcess');
        const moonUploadArea = document.getElementById('moonUploadArea');
        const topSatellite = document.getElementById('topSatellite');
        const earthTopDot = document.getElementById('earthTopDot');
        const flightPath = document.getElementById('flightPath');
        const flightSVG = document.getElementById('flightPathSVG');
        const moonScanBeam = document.getElementById('moonScanBeam');

        let uploadedBlobURL = null;
        let satelliteOnMoon = false;
        let currentSatelliteElem = null;

        // small helper: animate along SVG path using getPointAtLength
        function animateAlongPath(elem, path, duration, reverse=false, easingFunc=null, cb=null){
            const total = path.getTotalLength();
            const start = performance.now();
            function step(now){
                const t = Math.min(1,(now-start)/duration);
                const eased = easingFunc ? easingFunc(t) : (t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2); // default easeInOutCubic
                const len = reverse ? total*(1 - eased) : total*eased;
                const pt = path.getPointAtLength(len);
                elem.style.left = pt.x + 'px';
                elem.style.top = pt.y + 'px';
                elem.style.transform = 'translate(-50%,-50%)';
                if(t<1) requestAnimationFrame(step); else if(cb) cb();
            }
            requestAnimationFrame(step);
        }

        // convert SVG coordinates to page coordinates
        function svgPointToPage(pt, svg){
            const rect = svg.getBoundingClientRect();
            // flightSVG uses full viewport, so coordinates approximately match
            return {x: rect.left + pt.x*(rect.width/1920), y: rect.top + pt.y*(rect.height/1080)};
        }

        // proceed click: icons launch, moon rises and then central moon reveals
        proceedBtn.addEventListener('click', ()=>{
            // trigger icons launch (they fly away)
            iconsRow.classList.add('launched');
            // small immediate icon animation: scale up then off-screen via CSS class

            // lift the initial moon curve upward to simulate rising
            moonCurve.style.transition = 'bottom 0.9s cubic-bezier(.2,.9,.2,1), transform 0.95s cubic-bezier(.2,.9,.2,1)';
            moonCurve.style.transform = 'translateX(-50%) translateY(-30vh) scale(0.9)';
            // after a short delay, unzoom into central moon
            setTimeout(()=>{
                centralMoon.classList.add('revealed');
                // hide curve after central reveal
                setTimeout(()=>{ moonCurve.style.opacity = '0'; },700);
            },700);
            // also slightly animate topSatellite glow to hint orbit
            topSatellite.animate([{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:1200,iterations:1});
        });

        // choose image inside central moon
        moonChoose.addEventListener('click', ()=> moonFile.click());

        moonFile.addEventListener('change',(e)=>{
            const f = e.target.files && e.target.files[0];
            if(!f) return;
            if(uploadedBlobURL) URL.revokeObjectURL(uploadedBlobURL);
            uploadedBlobURL = URL.createObjectURL(f);
            // create img element inside moonUploadArea
            let img = document.querySelector('.preview-img');
            if(!img){ img = document.createElement('img'); img.className='preview-img'; moonUploadArea.appendChild(img);} 
            img.src = uploadedBlobURL;
            // show process button
            moonProcess.classList.remove('hide');
            moonChoose.textContent = 'Change Image';
            // after image added, trigger satellite departure from top orbit to moon
            launchSatelliteFromEarthToMoon();
        });

        // function to launch satellite from top right earth (topSatellite) along path to moon
        function launchSatelliteFromEarthToMoon(){
            if(satelliteOnMoon) return;
            // create moving satellite element positioned fixed
            const sat = topSatellite.cloneNode(true);
            sat.id = 'movingSat';
            sat.style.position = 'fixed';
            sat.style.zIndex = 50;
            document.body.appendChild(sat);
            // starting pos: topSatellite center
            const topRect = topSatellite.getBoundingClientRect();
            sat.style.left = (topRect.left + topRect.width/2) + 'px';
            sat.style.top = (topRect.top + topRect.height/2) + 'px';
            sat.style.transform = 'translate(-50%,-50%) scale(1)';

            // compute path point iterator using flightPath (SVG with viewport 1920x1080)
            const path = flightPath;
            // animate along path
            animateAlongPath(sat, path, 1200, false, null, ()=>{
                // arrive: snap satellite to central moon area (absolute center of centralMoon)
                const cmRect = centralMoon.getBoundingClientRect();
                sat.style.left = (cmRect.left + cmRect.width/2) + 'px';
                sat.style.top = (cmRect.top + cmRect.height/2 - 120) + 'px';
                // hold in place as orbiting around moon (CSS rotation subtle)
                sat.classList.add('sat-orbit');
                satelliteOnMoon = true;
                currentSatelliteElem = sat;
            });
        }

        moonProcess.addEventListener('click', ()=>{
            if(!satelliteOnMoon || !currentSatelliteElem){ alert('Satellite not present yet. Wait for arrival.'); return; }
            // scanning animation: beam sweeps across the uploaded image inside moon
            moonScanBeam.style.opacity = 1;
            moonScanBeam.style.transition = 'transform 2s linear, opacity .4s ease';
            moonScanBeam.style.transform = 'translateX(300%)';
            // init beam on left
            moonScanBeam.style.left = '-120%';
            requestAnimationFrame(()=>{ moonScanBeam.style.transform = 'translateX(0)'; moonScanBeam.style.left='0%'; });
            // during scan, small satellite bob / glow
            currentSatelliteElem.animate([{transform:'translate(-50%,-50%) translateY(0)'},{transform:'translate(-50%,-50%) translateY(-8px)'},{transform:'translate(-50%,-50%) translateY(0)'}],{duration:800,iterations:3});
            setTimeout(()=>{
                moonScanBeam.style.opacity = 0;
                // after scan, return satellite along reverse path with easing
                returnSatelliteToEarthWithPhysics(currentSatelliteElem);
            },2200);
        });

        function returnSatelliteToEarthWithPhysics(satElem){
            // remove orbiting class
            satElem.classList.remove('sat-orbit');
            // determine current page position (start)
            const startRect = satElem.getBoundingClientRect();
            const start = {x:startRect.left + startRect.width/2, y:startRect.top + startRect.height/2};
            // target earth position (topSatellite center)
            const targetRect = topSatellite.getBoundingClientRect();
            const target = {x: targetRect.left + targetRect.width/2, y: targetRect.top + targetRect.height/2};

            // create an elliptical return path by using the same flightPath but reverse
            const path = flightPath;
            // animate along reverse (moon->earth) with easing that simulates gravity (easeOutQuad overall but with velocity increase in middle)
            animateAlongPath(satElem, path, 1200, true, function(t){ // custom easing: easeInOutQuad
                return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
            }, ()=>{
                // land on earth: remove element
                satElem.remove();
                satelliteOnMoon = false;
                currentSatelliteElem = null;
                // show processed result toast / status
                setTimeout(()=>{ alert('Processing complete. Satellite returned to Earth.'); },200);
            });
        }

        // On window resize, we may need to update SVG sizes; flightPath uses relative 1920x1080 viewport so it's okay

    </script>
</body>
</html>
