<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunaP - DevJams '26 | Team KompilerZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #05050a;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* Background ambient glow */
        body::before {
            content: '';
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 400px;
            background: radial-gradient(circle, rgba(120, 50, 255, 0.18) 0%, rgba(5, 5, 10, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        header {
            width: 100%;
            padding: 16px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .gdg-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
        }

        .gdg-logo svg {
            width: 28px;
            height: 28px;
        }

        .gdg-text {
            display: flex;
            flex-direction: column;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
        }

        .gdg-sub {
            font-size: 9px;
            color: #a0a0a0;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .menu-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
        }

        .menu-cat {
            width: 34px;
            height: 34px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2300ffcc"><path d="M5 3L8.5 7H15.5L19 3L21 6V11C21 16.5 17 21 12 21C7 21 3 16.5 3 11V6L5 3M8 10C7.45 10 7 10.45 7 11C7 11.55 7.45 12 8 12C8.55 12 9 11.55 9 11C9 10.45 8.55 10 8 10M16 10C15.45 10 15 10.45 15 11C15 11.55 15.45 12 16 12C16.55 12 17 11.55 17 11C17 10.45 16.55 10 16 10M12 14C10.5 14 9.5 14.8 9 15.5C9 16.2 9.8 17 10.5 17C11.1 17 11.5 16.5 12 16.5C12.5 16.5 12.9 17 13.5 17C14.2 17 15 16.2 15 15.5C14.5 14.8 13.5 14 12 14Z"/></svg>') no-repeat center;
            filter: drop-shadow(0 0 8px rgba(0,255,204,0.7));
            transition: transform 0.3s ease;
        }

        .menu-container:hover .menu-cat {
            transform: scale(1.1) rotate(6deg);
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            max-width: 100vw;
            padding: 0 20px;
            z-index: 10;
            text-align: center;
            gap: 10px;
            margin-top: -10px;
        }

        .hero-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .lunap-title {
            font-size: clamp(8rem, 25vw, 24rem); 
            font-weight: 900;
            letter-spacing: -0.09em;
            line-height: 0.75;
            display: flex;
            justify-content: center;
            user-select: none;
            position: relative;
            z-index: 20;
            margin: 0;
            pointer-events: none;
        }

        .char {
            display: inline-block;
            color: #ffffff;
            -webkit-text-stroke: 2px #000000;
            text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s ease, text-shadow 0.3s ease;
            cursor: default;
            margin-right: -0.06em;
            pointer-events: auto;
        }
        .char:last-child {
            margin-right: 0;
        }

        .char:nth-child(1):hover { color: #a855f7; text-shadow: 0 0 25px rgba(168, 85, 247, 0.9), 4px 4px 0px rgba(0,0,0,0.9); transform: translateY(-18px) scale(1.1) rotate(-3deg); z-index: 25; }
        .char:nth-child(2):hover { color: #3b82f6; text-shadow: 0 0 25px rgba(59, 130, 246, 0.9), 4px 4px 0px rgba(0,0,0,0.9); transform: translateY(-18px) scale(1.1) rotate(3deg); z-index: 25; }
        .char:nth-child(3):hover { color: #8b5cf6; text-shadow: 0 0 25px rgba(139, 92, 246, 0.9), 4px 4px 0px rgba(0,0,0,0.9); transform: translateY(-18px) scale(1.1) rotate(-2deg); z-index: 25; }
        .char:nth-child(4):hover { color: #60a5fa; text-shadow: 0 0 25px rgba(96, 165, 250, 0.9), 4px 4px 0px rgba(0,0,0,0.9); transform: translateY(-18px) scale(1.1) rotate(4deg); z-index: 25; }
        .char:nth-child(5):hover { color: #c084fc; text-shadow: 0 0 25px rgba(192, 132, 252, 0.9), 4px 4px 0px rgba(0,0,0,0.9); transform: translateY(-18px) scale(1.1) rotate(-4deg); z-index: 25; }

        .icons-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap;
            z-index: 10;
            margin-top: clamp(-100px, -14vw, -200px);
            width: 100%;
            max-width: 1400px;
        }

        .space-icon {
            width: clamp(140px, 23vw, 320px);
            height: clamp(140px, 23vw, 320px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
            cursor: pointer;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.6));
            aspect-ratio: 1/1;
        }

        .space-icon:not(:first-child) {
            margin-left: clamp(-60px, -9vw, -125px);
        }

        /* Satellite (1) and Rover (3) share the exact same Y axis offset and pushed further down */
        .space-icon:nth-child(1) { transform: translateY(85px) rotate(-4deg); z-index: 4; }
        .space-icon:nth-child(2) { transform: translateY(50px) scale(1.15) rotate(2deg); z-index: 3; }
        .space-icon:nth-child(3) { transform: translateY(85px) scale(1.1) rotate(-2deg); z-index: 2; }
        .space-icon:nth-child(4) { transform: translateY(40px) rotate(4deg); z-index: 1; }

        .space-icon:nth-child(1):hover { transform: translateY(65px) scale(1.1) rotate(-4deg); filter: drop-shadow(0 25px 50px rgba(168, 85, 247, 0.8)); z-index: 12; }
        .space-icon:nth-child(2):hover { transform: translateY(30px) scale(1.25) rotate(2deg); filter: drop-shadow(0 25px 50px rgba(168, 85, 247, 0.8)); z-index: 12; }
        .space-icon:nth-child(3):hover { transform: translateY(65px) scale(1.2) rotate(-2deg); filter: drop-shadow(0 25px 50px rgba(168, 85, 247, 0.8)); z-index: 12; }
        .space-icon:nth-child(4):hover { transform: translateY(20px) scale(1.1) rotate(4deg); filter: drop-shadow(0 25px 50px rgba(168, 85, 247, 0.8)); z-index: 12; }
        
        @keyframes jumpBounce1 {
            0%, 100% { transform: translateY(85px) scale(1) rotate(-4deg); }
            50% { transform: translateY(60px) scale(1.06) rotate(-8deg); }
        }
        @keyframes jumpBounce2 {
            0%, 100% { transform: translateY(50px) scale(1.15) rotate(2deg); }
            50% { transform: translateY(25px) scale(1.2) rotate(0deg); }
        }
        @keyframes jumpBounce3 {
            0%, 100% { transform: translateY(85px) scale(1.1) rotate(-2deg); }
            50% { transform: translateY(60px) scale(1.18) rotate(-6deg); }
        }
        @keyframes jumpBounce4 {
            0%, 100% { transform: translateY(40px) scale(1) rotate(4deg); }
            50% { transform: translateY(15px) scale(1.06) rotate(2deg); }
        }

        .space-icon.jumping:nth-child(1) { animation: jumpBounce1 0.42s ease-in-out infinite; }
        .space-icon.jumping:nth-child(2) { animation: jumpBounce2 0.48s ease-in-out infinite; }
        .space-icon.jumping:nth-child(3) { animation: jumpBounce3 0.39s ease-in-out infinite; }
        .space-icon.jumping:nth-child(4) { animation: jumpBounce4 0.45s ease-in-out infinite; }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.35rem);
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
            max-width: 700px;
            margin-top: 30px;
            z-index: 10;
        }

        .btn-proceed {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            color: #05050a;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
            border: none;
            cursor: pointer;
            margin-top: 5px;
            margin-bottom: 20px;
            z-index: 10;
        }

        .btn-proceed:hover {
            transform: scale(1.08) translateY(-3px);
            background: #f1f5f9;
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.5);
        }

        .btn-proceed svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
        }

        .btn-proceed:hover svg {
            transform: translateX(6px);
        }

        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(168, 85, 247, 0.95);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            pointer-events: none;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        #laser-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
        }
    </style>
</head>
<body>

    <canvas id="laser-canvas"></canvas>

    <div id="toast">Initializing Autonomous Orbital Systems...</div>

    <header>
        <a href="#" class="gdg-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                    <line x1="25" y1="38" x2="25" y2="62" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

                    <line x1="87" y1="38" x2="87" y2="62" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

                    <rect x="34" y="30" width="32" height="40" rx="8" fill="url(#smoothGrad1)" />
                    
                    <rect x="38" y="36" width="24" height="18" rx="5" fill="#05050a" stroke="#7c3aed" stroke-width="2" opacity="0.95"/>
                    <circle cx="45" cy="45" r="4.5" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1.2"/>
                    <circle cx="55" cy="45" r="4.5" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1.2"/>

    <script>
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            updateTrackingSensors();
        });

        const roverLeftPupil = document.getElementById('left-pupil');
        const roverRightPupil = document.getElementById('right-pupil');

        const canvas = document.getElementById('laser-canvas');
        const ctx = canvas.getContext('2d');
        const proceedBtn = document.getElementById('proceed-btn');
        const spaceIcons = document.querySelectorAll('.space-icon');

        proceedBtn.addEventListener('mouseenter', () => {
            spaceIcons.forEach(icon => icon.classList.add('jumping'));
        });
        proceedBtn.addEventListener('mouseleave', () => {
            spaceIcons.forEach(icon => icon.classList.remove('jumping'));
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function updateTrackingSensors() {
            // Rover tracking
            const rovLBase = document.getElementById('left-eye-base').getBoundingClientRect();
            const rovRBase = document.getElementById('right-eye-base').getBoundingClientRect();
            if(rovLBase.width > 0) {
                const rlx = rovLBase.left + rovLBase.width / 2;
                const rly = rovLBase.top + rovLBase.height / 2;
                const rrx = rovRBase.left + rovRBase.width / 2;
                const rry = rovRBase.top + rovRBase.height / 2;

                const angleRovL = Math.atan2(mouseY - rly, mouseX - rlx);
                const angleRovR = Math.atan2(mouseY - rry, mouseX - rrx);
                const maxDistRov = 2.5;

                roverLeftPupil.setAttribute('cx', 40 + Math.cos(angleRovL) * maxDistRov);
                roverLeftPupil.setAttribute('cy', 28 + Math.sin(angleRovL) * maxDistRov);
                roverRightPupil.setAttribute('cx', 60 + Math.cos(angleRovR) * maxDistRov);
                roverRightPupil.setAttribute('cy', 28 + Math.sin(angleRovR) * maxDistRov);
            }
        }

        let laserPulse = 0;
        
        function renderLasers() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const btnRect = proceedBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;
            const distToBtn = Math.hypot(mouseX - btnCenterX, mouseY - btnCenterY);

            const isNearButton = distToBtn < 150 || (mouseX >= btnRect.left - 50 && mouseX <= btnRect.right + 50 && mouseY >= btnRect.top - 50 && mouseY <= btnRect.bottom + 50);
            
            const laserColor = isNearButton ? '#00ffcc' : '#ff2a6d';

            // Update rover pupil colors & glows
            [roverLeftPupil, roverRightPupil].forEach(p => {
                p.setAttribute('fill', laserColor);
                p.style.filter = `drop-shadow(0 0 8px ${laserColor})`;
            });

            const rovLRect = roverLeftPupil.getBoundingClientRect();
            const rovRRect = roverRightPupil.getBoundingClientRect();
            
            if (rovLRect.width === 0) {
                requestAnimationFrame(renderLasers);
                return;
            }

            laserPulse += 0.3;
            const alpha = 0.85 + Math.sin(laserPulse) * 0.15;

            // Draw Rover Lasers only
            [
                {x: rovLRect.left + rovLRect.width/2, y: rovLRect.top + rovLRect.height/2},
                {x: rovRRect.left + rovRRect.width/2, y: rovRRect.top + rovRRect.height/2}
            ].forEach(origin => {
                ctx.beginPath();
                ctx.moveTo(origin.x, origin.y);
                ctx.lineTo(mouseX, mouseY);
                ctx.strokeStyle = isNearButton ? `rgba(0, 255, 204, ${alpha * 0.8})` : `rgba(255, 42, 109, ${alpha * 0.8})`;
                ctx.lineWidth = 2;
                ctx.shadowColor = laserColor;
                ctx.shadowBlur = 18;
                ctx.stroke();
            });

            // Target Lock Glow at Mouse
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, isNearButton ? 8 : 6, 0, Math.PI * 2);
            ctx.fillStyle = isNearButton ? 'rgba(0, 255, 204, 0.9)' : 'rgba(255, 42, 109, 0.9)';
            ctx.fill();

            requestAnimationFrame(renderLasers);
        }

        requestAnimationFrame(renderLasers);

        function triggerToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
