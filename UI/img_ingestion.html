<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>img_ingestion - LunaP</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#05050a;
      --accent:#a855f7;
      --neon:#00ffcc;
      --highlight:#ff2a6d;
      --muted:#a0a0a0;
    }
    *{box-sizing:border-box;font-family:'Outfit',sans-serif}
    html,body{height:100%;margin:0;background:var(--bg);color:#fff}
    .page{min-height:100vh;display:flex;flex-direction:column}
    header{padding:18px 36px;display:flex;justify-content:space-between;align-items:center}
    .gdg-text{font-weight:800}
    main{flex:1;display:flex;gap:28px;padding:24px;align-items:center;justify-content:center}

    .panel{background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));border-radius:16px;padding:20px;width:520px;box-shadow:0 10px 40px rgba(168,85,247,0.08)}
    .panel h2{font-size:1.2rem;margin-bottom:8px}
    .muted{color:var(--muted);font-size:0.95rem}

    /* preview area (moon) */
    .vis-panel{width:560px;height:520px;position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 20% 20%, #111018 0%, #07060b 40%, #05050a 100%);box-shadow:0 30px 80px rgba(0,0,0,0.6)}

    /* Moon area where uploaded image will be placed */
    .moon-scene{position:absolute;right:6%;bottom:8vh;width:320px;height:320px;transform:translateY(12px);z-index:5}
    .moon-circle{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 30%, #f8fafc 0%, #e6e8ff 20%, #d6d3f9 45%, #bdb8f6 70%, #a78bfa 100%);box-shadow:inset -10px -6px 30px rgba(0,0,0,0.45);position:relative}

    .moon-crater{position:absolute;border-radius:50%;background:rgba(5,5,10,0.15);box-shadow:inset -4px -3px 8px rgba(0,0,0,0.4)}
    .moon-crater.c1{left:12%;top:18%;width:30px;height:30px}
    .moon-crater.c2{left:62%;top:16%;width:42px;height:42px}
    .moon-crater.c3{left:44%;top:58%;width:26px;height:26px}

    /* earth dot */
    .earth-wrap{position:absolute;left:10%;bottom:14%;width:48px;height:48px;z-index:8}
    .earth-dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #9ef6d4 0%, #22d0ff 55%, #0b61ff 100%);box-shadow:0 8px 28px rgba(11,97,255,0.35);transform-origin:center;opacity:1;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1)}

    /* satellite */
    .satellite{position:absolute;width:48px;height:48px;left:0;top:0;transform:translate(-50%,-50%) scale(0.85);z-index:20;will-change:transform}
    .sat-hidden{opacity:0;transform:translate(-50%,-50%) scale(0.5)}

    /* orbit container around moon */
    .orbit-container{position:absolute;right:6%;bottom:8vh;width:340px;height:340px;border-radius:50%;pointer-events:none;transform-origin:center;z-index:6}
    .orbiting{animation:orbit 6s linear infinite}
    @keyframes orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

    /* trajectory path (visual) */
    .traj{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

    /* preview image box */
    .preview{width:280px;height:180px;border-radius:10px;background:#08101a;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
    .preview img{max-width:100%;max-height:100%;display:block}

    .controls{display:flex;flex-direction:column;gap:12px}
    .file-row{display:flex;gap:12px;align-items:center}
    .btn{background:#fff;color:var(--bg);padding:10px 14px;border-radius:999px;font-weight:700;border:none;cursor:pointer}
    .btn.secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.06)}

    /* scanning overlay */
    .scan-overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
    .scan-beam{position:absolute;left:-50%;top:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,255,204,0.55),transparent);transform:skewX(-12deg);opacity:0}

    /* messages */
    .status{margin-top:8px;color:var(--muted);font-weight:600}

    /* responsive */
    @media(max-width:980px){main{flex-direction:column;padding:12px} .vis-panel{width:92%;height:460px}}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div style="display:flex;align-items:center;gap:12px"><svg width="36"height="36"viewBox="0 0 24 24"fill="none"xmlns="http://www.w3.org/2000/svg"><path d="M7 8L3 12L7 16" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 8L21 12L17 16" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 6L10 18" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round"/></svg><div class="gdg-text">Team KompilerZ<span style="display:block;font-size:11px;color:var(--muted);font-weight:600">DevJams'26 • LunaP</span></div></div>
      <div style="color:var(--muted);font-weight:600">Image Ingestion</div>
    </header>

    <main>
      <section class="panel">
        <h2>Upload an image</h2>
        <div class="muted">Choose an image to scan from lunar orbit. The satellite will launch from Earth and wait in orbit.</div>

        <div class="controls" style="margin-top:16px">
          <div class="file-row">
            <label class="btn" for="fileInput">Choose file</label>
            <input id="fileInput" type="file" accept="image/*" style="opacity:0;position:absolute;left:-9999px" />
            <button class="btn secondary" id="uploadBtn">Upload & Launch</button>
          </div>

          <div style="display:flex;gap:12px;align-items:center;margin-top:12px">
            <div class="preview" id="previewBox"><div class="muted">No image selected</div><div class="scan-overlay"><div class="scan-beam" id="scanBeam"></div></div></div>
            <div style="flex:1">
              <div style="display:flex;gap:8px"><button class="btn" id="processBtn" disabled>Proceed with processing</button><button class="btn secondary" id="resetBtn">Reset</button></div>
              <div class="status" id="statusText">Satellite: idle • Orbit: not engaged</div>
            </div>
          </div>
        </div>
      </section>

      <section class="vis-panel">
        <!-- Earth (left) -->
        <div class="earth-wrap" id="earthWrap">
          <svg viewBox="0 0 64 64" width="48" height="48" class="earth-svg">
            <defs>
              <radialGradient id="eg" cx="20%" cy="25%"><stop offset="0%" stop-color="#bff3db"/><stop offset="60%" stop-color="#1ecbff"/><stop offset="100%" stop-color="#0b61ff"/></radialGradient>
            </defs>
            <circle cx="32" cy="32" r="28" fill="url(#eg)" stroke="#06345a" stroke-width="2"/>
            <path d="M12 28c6 4 8-2 14 2s6 6 12 2" fill="rgba(255,255,255,0.06)"/>
          </svg>
          <div class="earth-dot" id="earthDot"></div>
        </div>

        <!-- Moon + orbit -->
        <div class="moon-scene" id="moonScene">
          <div class="moon-circle">
            <div class="moon-crater c1"></div>
            <div class="moon-crater c2"></div>
            <div class="moon-crater c3"></div>
          </div>
        </div>

        <div class="orbit-container" id="orbitContainer" aria-hidden="true">
          <svg class="traj" viewBox="0 0 640 480" preserveAspectRatio="none">
            <path id="trajPath" d="M80,420 C200,300 340,260 460,240" stroke="rgba(168,85,247,0.2)" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
          <!-- satellite (absolute) -->
          <div id="satellite" class="satellite sat-hidden" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
              <rect x="6" y="18" width="52" height="28" rx="4" fill="#0b0b10" stroke="#7c3aed" stroke-width="2"/>
              <rect x="10" y="22" width="10" height="20" rx="2" fill="#ffffff" opacity="0.06"/>
              <rect x="44" y="22" width="10" height="20" rx="2" fill="#ffffff" opacity="0.06"/>
              <rect x="28" y="8" width="8" height="12" rx="2" fill="#3b82f6" />
              <circle cx="32" cy="32" r="4" fill="#00ffcc" />
              <path d="M2 30 L12 36" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
              <path d="M62 30 L52 36" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

      </section>
    </main>
  </div>

  <script>
    // Utility: animate an element along a cubic Bezier easing using requestAnimationFrame
    function animatePath(elem, from, to, duration, onProgress, onDone){
      const start = performance.now();
      function tick(now){
        const t = Math.min(1,(now-start)/duration);
        // easeInOutCubic
        const eased = t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
        const x = from.x + (to.x - from.x)*eased;
        const y = from.y + (to.y - from.y)*eased;
        onProgress({x,y,t:eased});
        if(t<1) requestAnimationFrame(tick);
        else { if(onDone) onDone(); }
      }
      requestAnimationFrame(tick);
    }

    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const processBtn = document.getElementById('processBtn');
    const resetBtn = document.getElementById('resetBtn');
    const previewBox = document.getElementById('previewBox');
    const scanBeam = document.getElementById('scanBeam');
    const satellite = document.getElementById('satellite');
    const orbitContainer = document.getElementById('orbitContainer');
    const earthWrap = document.getElementById('earthWrap');
    const moonScene = document.getElementById('moonScene');
    const statusText = document.getElementById('statusText');

    let uploadedImageURL = null;
    let isOrbiting = false;

    // preview helper
    fileInput.addEventListener('change', (e)=>{
      const f = e.target.files && e.target.files[0];
      if(!f) return;
      const url = URL.createObjectURL(f);
      uploadedImageURL = url;
      previewBox.innerHTML = '';
      const img = document.createElement('img'); img.src = url; previewBox.appendChild(img);
      // add overlay container for scanning beam
      const overlay = document.createElement('div'); overlay.className='scan-overlay';
      const beam = document.createElement('div'); beam.className='scan-beam'; beam.id='scanBeam'; overlay.appendChild(beam);
      previewBox.appendChild(overlay);
      processBtn.disabled = false;
      statusText.textContent = 'Satellite: ready • Orbit: not engaged';
    });

    // Upload button launches satellite from earth to moon orbit
    uploadBtn.addEventListener('click', ()=>{
      if(!uploadedImageURL){ alert('Select an image first using Choose file'); return; }
      launchSatelliteToOrbit();
    });

    resetBtn.addEventListener('click', ()=>{
      location.reload();
    });

    processBtn.addEventListener('click', ()=>{
      if(!isOrbiting){ alert('Satellite not in orbit yet. Upload & launch first.'); return; }
      startScanning();
    });

    function getCenter(el){
      const r = el.getBoundingClientRect();
      return {x:r.left + r.width/2, y:r.top + r.height/2};
    }

    function launchSatelliteToOrbit(){
      statusText.textContent = 'Satellite: launching...';
      // make satellite visible and position at earth center
      const earthC = getCenter(earthWrap);
      const moonC = getCenter(moonScene);
      satellite.classList.remove('sat-hidden');
      satellite.style.position='fixed';

      // set starting pos
      satellite.style.left = earthC.x + 'px';
      satellite.style.top = earthC.y + 'px';

      // animate to orbit approach point (a point near moon)
      const orbitPoint = {x: moonC.x - 20, y: moonC.y - 40};
      animatePath(satellite, {x:earthC.x,y:earthC.y}, orbitPoint, 1000, (p)=>{
        satellite.style.transform = `translate(-50%,-50%) translate(${p.x - earthC.x}px, ${p.y - earthC.y}px)`;
      }, ()=>{
        // attach satellite to orbit container center and start orbit animation
        // compute relative position inside orbitContainer
        const orbitRect = orbitContainer.getBoundingClientRect();
        const relX = orbitPoint.x - orbitRect.left;
        const relY = orbitPoint.y - orbitRect.top;
        satellite.style.position='absolute';
        satellite.style.left = relX + 'px';
        satellite.style.top = relY + 'px';
        orbitContainer.appendChild(satellite);

        satellite.classList.add('orbiting');
        isOrbiting = true;
        statusText.textContent = 'Satellite: in orbit • Awaiting processing';
      });
    }

    function startScanning(){
      statusText.textContent = 'Satellite: scanning...';
      // Stop orbit for a brief scan: remove orbiting and animate small local scan sweep over preview
      satellite.classList.remove('orbiting');
      // position satellite visually above the moon (send to top of orbitContainer)
      // create beam sweep over the preview image
      const beam = document.querySelector('#scanBeam') || scanBeam;
      if(beam){
        beam.style.opacity = '1';
        beam.style.transition = 'transform 2.2s linear, opacity 0.3s ease';
        beam.style.transform = 'translateX(350%)';
        // reset to left
        beam.style.left = '-120%';
        requestAnimationFrame(()=>{
          beam.style.transform = 'translateX(0)';
          beam.style.left = '0%';
        });
        // after scan finish
        setTimeout(()=>{
          beam.style.opacity='0';
          statusText.textContent = 'Satellite: scan complete • Returning to Earth';
          returnSatelliteToEarth();
        },2400);
      } else {
        // fallback
        setTimeout(()=>{ statusText.textContent='Satellite: scan complete • Returning to Earth'; returnSatelliteToEarth(); },2000);
      }
    }

    function returnSatelliteToEarth(){
      // animate from current absolute pos in orbitContainer back to earth fixed position
      const orbitRect = orbitContainer.getBoundingClientRect();
      const satRect = satellite.getBoundingClientRect();
      const from = {x: satRect.left + satRect.width/2, y: satRect.top + satRect.height/2};
      const earthC = getCenter(earthWrap);

      // move satellite back to page fixed coordinates
      satellite.style.position='fixed';
      animatePath(satellite, from, {x:earthC.x,y:earthC.y}, 1000, (p)=>{
        satellite.style.left = p.x + 'px';
        satellite.style.top = p.y + 'px';
        satellite.style.transform = 'translate(-50%,-50%)';
      }, ()=>{
        // landed on earth
        statusText.textContent = 'Satellite: landed • Processing on Earth...';
        // simulate processing
        setTimeout(()=>{
          statusText.textContent = 'Processing complete — result available';
          alert('Image processing simulation complete (demo).');
        },1600);
      });
    }

    // ensure layout measurements are correct on load
    window.addEventListener('load', ()=>{
      // small pulse on earth dot
      const ed = document.getElementById('earthDot');
      if(ed) ed.animate([{transform:'scale(0.9)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:1400,iterations:1,easing:'ease-out'});
    });

  </script>
</body>
</html>
